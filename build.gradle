// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.8.10'   // 锁 1.8.x：kotlin-android-extensions 在 Kotlin 1.9 已被移除，本项目 57 个文件依赖 synthetic 导入
    repositories {
        // 阿里云镜像放前面：jcenter 已停服，但镜像仍缓存着当年只在 jcenter 发布过的包
        // （code-scanner / zxing-android-embedded 3.4.0 / simplecropview / singledateandtimepicker），国内拉取也更快
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        // Kotlin 插件改由 app/build.gradle 的 plugins DSL 显式指定版本（见该文件注释）
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
