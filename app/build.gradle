plugins {
    id 'com.android.application'
    // ⚠️ Kotlin 必须锁 1.7.22：kotlin-android-extensions 在 Kotlin 1.8.0 起变成**硬错误**
    //    （实测 1.8.10 / 1.8.22 均报 "no longer supported"，只有 1.7.22 能过）。
    //    本项目 57 个文件用 kotlinx.android.synthetic，保住 1.7.22 就不必重写这 57 个文件。
    id 'org.jetbrains.kotlin.android' version '1.7.22'
    id 'org.jetbrains.kotlin.android.extensions' version '1.7.22'
    id 'org.jetbrains.kotlin.kapt' version '1.7.22'
}

android {
    // namespace = 代码包名，必须与源码 package 一致（130 个文件都 import com.example.barcodescanner.R）
    // 安装标识另由 defaultConfig.applicationId 指定 —— 二者本就可以不同
    namespace "com.example.barcodescanner"
    compileSdk 34

    defaultConfig {
        applicationId "com.lawrencej.barcodescanner"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 20
        versionName "1.11-lj"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary  true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.incremental":"true"]
            }
        }

        // 关闭错误上报：原版会把崩溃发到 upstream 作者的 Sentry（改用他人 DSN 不合适）
        buildConfigField "boolean", "ERROR_REPORTS_ENABLED_BY_DEFAULT", "false"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    /**
     * Release 签名：密钥与密码放在 ~/.gradle/gradle.properties（不进仓库），
     * 需要以下四项：BCS_STORE_FILE / BCS_STORE_PASSWORD / BCS_KEY_ALIAS / BCS_KEY_PASSWORD
     * 未配置时也能构建，只是产物未签名（无法安装）。
     */
    signingConfigs {
        release {
            if (project.hasProperty("BCS_STORE_FILE")) {
                storeFile file(project.property("BCS_STORE_FILE"))
                storePassword project.property("BCS_STORE_PASSWORD")
                keyAlias project.property("BCS_KEY_ALIAS")
                keyPassword project.property("BCS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty("BCS_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true          // AGP 8 起默认关闭，本项目用到 BuildConfig.ERROR_REPORTS_ENABLED_BY_DEFAULT
    }
    // 已移除 productFlavors(amazon/aptoide/googlePlay/fDroid)：本地自用只需单一包；main 自带 res/xml/shortcuts.xml
}

// 统一 kotlin-stdlib 系列版本：老依赖(code-scanner/simplecropview)会拖进 stdlib-jdk8:1.6.21，
// 与新版 stdlib 撞 Duplicate class，必须对齐到编译器版本
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.7.22'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.22"

    // Android —— 版本与 Kotlin 1.7.22 同年，避免"库元数据比编译器新"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Room
    final roomVersion = "2.4.2"
    kapt "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"

    // Paging
    final pagingVersion = "1.0.1"
    implementation "android.arch.paging:runtime:$pagingVersion"
    implementation "android.arch.paging:rxjava2:$pagingVersion"

    // Barcode Scanner
    implementation 'com.budiyev.android:code-scanner:2.1.0'

    // Barcode Image Generator
    //noinspection GradleDependency
    implementation 'com.journeyapps:zxing-android-embedded:3.4.0'

    // VCard Parser
    implementation 'com.googlecode.ez-vcard:ez-vcard:0.11.0'

    // Base32 Encoder
    implementation "commons-codec:commons-codec:1.15"

    // OTP
    implementation "dev.turingcomplete:kotlin-onetimepassword:2.0.1"

    // Rx
    implementation "io.reactivex.rxjava2:rxkotlin:2.3.0"
    implementation "com.jakewharton.rxbinding2:rxbinding-appcompat-v7-kotlin:2.2.0"

    // Image Crop Library
    implementation 'com.isseiaoki:simplecropview:1.1.8'

    // Date time picker
    implementation 'com.github.florent37:singledateandtimepicker:2.2.6'

    // 已移除 io.sentry:sentry-android —— 本 fork 不上报崩溃数据到第三方；
    // 且其 SentryInitProvider 在缺 DSN 时会于进程启动时抛异常导致闪退（2026-10-01 实测）
}
